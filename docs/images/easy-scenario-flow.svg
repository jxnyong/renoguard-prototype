<title id="title">RenoGuard Easy Scenario — User Flow Diagram</title>
<desc id="desc">A three-row serpentine filming flow. Report: Home, Report Defect, Defect Saved, revisit Home, Approvals. Review from right to left: Change Review, Bathroom Preview, Quotes and Variations via Budget, Quotation Detail, Budget. Approve from left to right: revisit Change Review, Approval Confirmation, Approval Receipt, revisit Budget, Payment Timeline.</desc>
