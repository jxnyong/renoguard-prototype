<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183c5a">
  <meta name="description" content="RenoGuard for mobile. Review renovation changes, track defects, and stay in control of your project budget.">
  <title>RenoGuard · Mobile</title>
  <link rel="icon" href="assets/renoguard-mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/bathroom.webp" as="image">
  <link rel="stylesheet" href="mobile/styles.css">
  <script src="shared/project-store.js" defer></script>
  <script src="mobile/room-model.js" defer></script>
  <script src="mobile/comparison.js" defer></script>
  <script src="mobile/app.js" defer></script>
</head>
<body>
  <div class="startup" id="startup" aria-label="Preparing your project"><span class="startup-logo"><img src="assets/renoguard-mark.svg" width="64" height="64" alt=""></span><strong>RenoGuard</strong><p>Loading project…</p><span class="startup-track"><i></i></span></div>
  <a class="skip-link" href="#content">Skip to screen content</a>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></symbol>
    <symbol id="i-rooms" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h8m4 0h6M12 3v5m0 8v5"/></symbol>
    <symbol id="i-defects" viewBox="0 0 24 24"><path d="m12 3 10 18H2zM12 9v5m0 3v.1"/></symbol>
    <symbol id="i-changes" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></symbol>
    <symbol id="i-budget" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18m0 4h-6v4h6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M8 5 6 8H3v12h18V8h-3l-2-3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m10 3 2.5 6.5L19 12l-6.5 2.5L10 21l-2.5-6.5L1 12l6.5-2.5zM19 2v5m-2.5-2.5h5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-10-7-4zM10 11 21 3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>
  <div class="mobile-app">
    <div class="app-viewport">
    <header class="app-header">
      <button class="icon-button back-button" data-action="back" aria-label="Back to previous screen" hidden><svg><use href="#i-back"/></svg></button>
      <a class="brand" href="#overview" aria-label="RenoGuard overview"><img class="brand-mark" src="assets/renoguard-mark.svg" width="36" height="36" alt="">RenoGuard</a>
      <span class="header-context" id="header-context" hidden></span>
      <div class="header-actions"><a class="icon-button header-home" href="#overview" aria-label="Back to home" hidden><svg><use href="#i-home"/></svg></a><a class="icon-button notification-button" href="#updates" aria-label="Project updates"><svg><use href="#i-bell"/></svg><span class="notification-dot" id="notification-dot"></span></a><a class="avatar" href="#profile" aria-label="Your profile">TE</a></div>
    </header>
    <div id="storage-notice" class="storage-notice" hidden>Saving is unavailable in this browser. Your changes may disappear after a reload.</div>
    <main id="content" tabindex="-1"></main>
    </div>
    <div class="variation-actions" id="variation-actions" aria-label="Variation actions" hidden></div>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#overview" data-tab="overview" aria-current="page"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#defects" data-tab="defects"><svg><use href="#i-defects"/></svg><span>Defects</span><span class="nav-dot" id="defect-nav-dot" hidden></span></a>
      <a href="#changes" data-tab="changes"><svg><use href="#i-changes"/></svg><span>Approvals</span><span class="nav-dot" id="change-nav-dot"></span></a>
      <a href="#budget" data-tab="budget"><svg><use href="#i-budget"/></svg><span>Budget</span></a>
      <a href="#more" data-tab="more"><svg><use href="#i-more"/></svg><span>Tools</span></a>
    </nav>
  </div>
  <dialog id="room-dialog" class="room-dialog" aria-labelledby="room-dialog-title"><div id="room-dialog-content"></div></dialog>
  <div class="sr-only" id="announcements" role="status" aria-live="polite"></div>
  <noscript><style>.startup{display:none}</style><p class="noscript">Enable JavaScript to use the prototype.</p></noscript>
</body>
</html>
